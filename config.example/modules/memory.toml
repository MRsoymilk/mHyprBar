interval_ms = 1000

# Compact two-line status-bar view.
# SVG icons are scaled relative to each row's available height.
icon_scale = 1.0
icon_gap = 3
bar_width = 42
bar_height = 6
row_gap = 2
text_gap = 3
bar_background = "#303030"
memory_fill = "#4EA1FF"
swap_fill = "#A56BFF"

[style]
foreground = "#f2f2f2"
background = "transparent"
font_family = "sans-serif"
font_size = 9.0
padding_x = 5
padding_y = 1
min_width = 0

[popup]
enabled = true
width = 430
row_height = 24
padding = 10
refresh_ms = 1000
max_processes = 10
bar_width = 92
bar_background = "#303030"
memory_fill = "#4EA1FF"
swap_fill = "#A56BFF"
border = "#626262"
separator = "#626262"
hover_background = "#3A3A3AF0"

[popup.style]
foreground = "#F2F2F2"
background = "#202020F2"
font_family = "sans-serif"
font_size = 12.0
padding_x = 0
padding_y = 0
min_width = 0
