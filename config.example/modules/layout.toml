layouts = ["dwindle", "master", "scrolling", "monocle"]
interval_ms = 750
# Visible layout icon scale relative to the bar's available height.
icon_scale = 0.8

[style]
foreground = "#F2F2F2"
background = "transparent"
font_family = "sans-serif"
font_size = 12.0
padding_x = 5
padding_y = 0
min_width = 0
