layouts = ["dwindle", "floating"]
interval_ms = 750
# Visible layout icon scale relative to the bar's available height.
icon_scale = 0.8

[style]
foreground = "#F2F2F2"
background = "transparent"
font_family = "sans-serif"
font_size = 12.0
padding_x = 5
padding_y = 0
min_width = 0

[popup]
enabled = true
width = 240
padding = 8
title_height = 28
row_height = 40
border = "#3C414A"
separator = "#353A42"
active_background = "#26384A"
hover_background = "#2A2D33"

[popup.style]
foreground = "#F2F2F2"
background = "#17191DEB"
font_family = "sans-serif"
font_size = 12.0
padding_x = 0
padding_y = 0
min_width = 0
