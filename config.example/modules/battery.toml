# "auto" discovers the first /sys/class/power_supply/* device whose type is Battery.
# On a desktop with no battery, the module stays empty without logging an error.
device = "auto"
interval_ms = 10000
low_percent = 20.0
empty_text = ""

[style]
foreground = "#f2f2f2"
background = "transparent"
font_family = "sans-serif"
font_size = 13.0
padding_x = 8
padding_y = 4
min_width = 72
