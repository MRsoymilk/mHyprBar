time_format = "%H:%M"
date_format = "%a %d %b"
interval_ms = 1000
time_font_size = 13.0
date_font_size = 8.5
row_gap = 0

[style]
foreground = "#f2f2f2"
background = "transparent"
font_family = "sans-serif"
font_size = 13.0
padding_x = 7
padding_y = 1
min_width = 0

[popup]
enabled = true
width = 322
padding = 14
header_height = 48
weekday_height = 24
cell_height = 32
refresh_ms = 60000
border = "#3C414A"
separator = "#353A42"
today_background = "#4D7DFF"
today_foreground = "#FFFFFF"
adjacent_foreground = "#5F6670"
weekday_foreground = "#9198A4"

[popup.style]
foreground = "#F2F2F2"
background = "#17191DEB"
font_family = "sans-serif"
font_size = 12.0
padding_x = 0
padding_y = 0
min_width = 0
