# The first mount is shown in the bar; all configured mounts appear in the popup.
mounts = ["/"]
interval_ms = 5000

bar_width = 40
bar_height = 14
bar_border_width = 1
bar_background = "#22222266"
bar_fill = "#AAAAAA"
bar_border = "#535D6C99"

[style]
foreground = "#f2f2f2"
background = "transparent"
font_family = "sans-serif"
font_size = 12.0
padding_x = 5
padding_y = 0
min_width = 0

[popup]
enabled = true
width = 420
row_height = 28
padding = 10
refresh_ms = 5000
bar_width = 120
bar_background = "#22222266"
bar_fill = "#AAAAAA"
bar_border = "#535D6C99"
border = "#626262"
hover_background = "#3A3A3AF0"

[popup.style]
foreground = "#F2F2F2"
background = "#202020F2"
font_family = "sans-serif"
font_size = 12.0
padding_x = 0
padding_y = 0
min_width = 0
