# auto = prefer NVIDIA via nvidia-smi, then fall back to DRM/sysfs.
# Explicit values: nvidia, amd, intel, drm.
backend = "auto"

# auto = first matching device.
# NVIDIA: GPU index, e.g. "0".
# DRM/sysfs: card name or number, e.g. "card0" or "0".
device = "auto"

interval_ms = 1000

# GPU SVG spans both compact rows. Scale is relative to the bar's available height.
icon_scale = 0.8
icon_gap = 4

# Compact two-line view: GPU utilization + dedicated VRAM utilization.
bar_width = 42
bar_height = 6
row_gap = 2
text_gap = 3
bar_background = "#303030"
utilization_fill = "#76B900"
memory_fill = "#4EA1FF"

[style]
foreground = "#f2f2f2"
background = "transparent"
font_family = "sans-serif"
font_size = 9.0
padding_x = 5
padding_y = 1
min_width = 0

[popup]
enabled = true
width = 560
padding = 12
title_height = 34
row_height = 30
refresh_ms = 1000
max_processes = 8
bar_width = 140
bar_background = "#303030"
utilization_fill = "#76B900"
memory_fill = "#4EA1FF"
border = "#3C414A"
separator = "#353A42"

[popup.style]
foreground = "#F2F2F2"
background = "#17191DEB"
font_family = "sans-serif"
font_size = 12.0
padding_x = 0
padding_y = 0
min_width = 0
