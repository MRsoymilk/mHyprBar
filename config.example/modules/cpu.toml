label = ""
interval_ms = 1000
warn_percent = 85.0

graph_enabled = true
graph_width = 50
graph_height = 18
step_width = 2
step_spacing = 1
text_gap = 6
show_percent = false

# Low load stays at graph_low. Higher bars extend into graph_mid and graph_high.
graph_background = "#00000000"
graph_low = "#F2F2F2"
graph_mid = "#FFFF00"
graph_high = "#FF0000"

[style]
foreground = "#f2f2f2"
background = "transparent"
font_family = "sans-serif"
font_size = 13.0
padding_x = 6
padding_y = 4
min_width = 0
