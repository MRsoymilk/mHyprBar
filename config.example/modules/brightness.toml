device = "auto"
interval_ms = 750
step_percent = 5
min_percent = 5
# Visible SVG content scale relative to the bar's available height.
icon_scale = 1.0
text_gap = 4
fill = "#FFD84A"

[style]
foreground = "#F2F2F2"
background = "transparent"
font_family = "sans-serif"
font_size = 10.0
padding_x = 5
padding_y = 0
min_width = 0

[popup]
enabled = true
width = 520
padding = 10
title_height = 30
row_height = 54
refresh_interval_ms = 1000
border = "#3C414A"
separator = "#353A42"
active_background = "#3B3520"
bar_background = "#30343A"
bar_fill = "#FFD84A"

[popup.style]
foreground = "#F2F2F2"
background = "#17191DEB"
font_family = "sans-serif"
font_size = 12.0
padding_x = 0
padding_y = 0
min_width = 0
